<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Habit Tracker</title>
  <desc id="desc">Private routine planning, progress, and analytics</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b172b"/>
      <stop offset="1" stop-color="#11152f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glowNode" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="135" cy="70" rx="330" ry="230" fill="url(#glow)"/>

  <g transform="translate(68 55)">
    <rect width="210" height="34" rx="17" fill="#142139" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <circle cx="18" cy="17" r="5" fill="#2dd4bf" filter="url(#glowNode)"/>
    <text x="34" y="22" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.15">LOCAL-FIRST APP</text>

    <text y="111" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="760" letter-spacing="-1.2">Habit Tracker</text>
    <rect y="132" width="515" height="4" rx="2" fill="url(#accent)"/>
    <text y="176" fill="#b7c3d6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Private routine planning, progress, and analytics</text>
    <text y="219" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="1.1">HO NGUYEN THIEN VU • AI ENGINEERING PORTFOLIO</text>
  </g>

  <g transform="translate(848 30)">
    <path d="M-40 68C20 10 75 28 120 70S220 126 286 64" fill="none" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="2"/>
    
      <g transform="translate(0 74)">
        <rect width="275" height="52" rx="13" fill="#111d34" stroke="#2dd4bf" stroke-opacity="0.20"/>
        <circle cx="22" cy="26" r="5" fill="#2dd4bf"/>
        <text x="39" y="22" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.2">DATA</text>
        <text x="39" y="39" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">LOCAL</text>
      </g>
      <g transform="translate(0 146)">
        <rect width="275" height="52" rx="13" fill="#111d34" stroke="#2dd4bf" stroke-opacity="0.20"/>
        <circle cx="22" cy="26" r="5" fill="#60a5fa"/>
        <text x="39" y="22" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.2">ACCOUNT</text>
        <text x="39" y="39" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">NONE</text>
      </g>
      <g transform="translate(0 218)">
        <rect width="275" height="52" rx="13" fill="#111d34" stroke="#2dd4bf" stroke-opacity="0.20"/>
        <circle cx="22" cy="26" r="5" fill="#2dd4bf"/>
        <text x="39" y="22" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.2">UI</text>
        <text x="39" y="39" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">RESPONSIVE</text>
      </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-width="2"/>
</svg>